name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: reviewlens
          POSTGRES_USER: reviewlens
          POSTGRES_PASSWORD: reviewlens
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U reviewlens"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build with Maven
        run: ./mvnw clean verify
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/reviewlens
          SPRING_DATASOURCE_USERNAME: reviewlens
          SPRING_DATASOURCE_PASSWORD: reviewlens