services:
  postgres:
    image: postgres:16
    container_name: reviewlens-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: reviewlens
      POSTGRES_USER: reviewlens
      POSTGRES_PASSWORD: reviewlens
    ports:
      - "5432:5432"
    volumes:
      - reviewlens_postgres_data:/var/lib/postgresql/data

  reviewlens:
    build: .
    container_name: reviewlens-app
    depends_on:
      - postgres
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker

volumes:
  reviewlens_postgres_data: