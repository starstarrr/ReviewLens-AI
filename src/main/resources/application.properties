spring.application.name=reviewlens

spring.datasource.url=jdbc:postgresql://localhost:5432/reviewlens
spring.datasource.username=reviewlens
spring.datasource.password=reviewlens
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

management.endpoints.web.exposure.include=health,info
reviewlens.ai.bedrock.model-id= us.anthropic.claude-sonnet-4-6

spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=read:user,user:email

reviewlens.frontend-url=${FRONTEND_URL:http://localhost:5173}
server.error.include-message=always
server.error.include-binding-errors=always