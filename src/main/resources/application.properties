spring.application.name=reviewlens

server.address=0.0.0.0
server.port=8080
server.forward-headers-strategy=framework

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/reviewlens}
spring.datasource.username=${DB_USERNAME:reviewlens}
spring.datasource.password=${DB_PASSWORD:reviewlens}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

management.endpoints.web.exposure.include=health,info

spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=read:user,user:email
spring.security.oauth2.client.registration.github.redirect-uri=http://localhost:5173/login/oauth2/code/{registrationId}

reviewlens.frontend-url=${FRONTEND_URL:http://localhost:5173}

reviewlens.ai.bedrock.model-id=${BEDROCK_MODEL_ID:us.anthropic.claude-sonnet-4-6}

aws.s3.bucket-name=${AWS_S3_BUCKET_NAME:reviewlens-xingranma-reports}
aws.region=${AWS_REGION:us-west-2}

server.error.include-message=always
server.error.include-binding-errors=always